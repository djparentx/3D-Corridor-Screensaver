name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libsdl2-dev libgles-dev git ca-certificates

      - uses: actions/checkout@v4

      - name: Build
        run: make -j"$(nproc)"

      - name: Check size
        run: |
          size=$(stat -c %s 3D_Backrooms)
          printf '%-14s %s bytes\n' "Binary size" "$size"
          if [ "$size" -gt 1048576 ]; then
            printf '%-14s %s\n' "ERROR" "binary exceeds 1MB"
            exit 1
          fi

      - name: Show dependencies
        run: readelf -d 3D_Backrooms | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: 3D_Backrooms
          path: 3D_Backrooms
